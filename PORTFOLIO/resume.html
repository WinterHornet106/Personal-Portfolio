<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resume — Jay Ho</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink:    #1a1a18;
      --muted:  #6b6860;
      --accent: #C8A96E;
      --blue:   #6B8FAE;
      --font:   -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      background: #D4D8E0;
      color: var(--ink);
      font-family: var(--font);
      font-size: 16px;
      line-height: 1.6;
      overflow-x: hidden;
      cursor: none;
      -webkit-font-smoothing: antialiased;
    }

    .bg-mesh { position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 80% 60% at 10% 20%, rgba(195,205,225,0.65) 0%, transparent 60%),
        radial-gradient(ellipse 60% 70% at 90% 10%, rgba(180,195,220,0.4)  0%, transparent 55%),
        radial-gradient(ellipse 70% 50% at 50% 90%, rgba(185,200,215,0.45) 0%, transparent 60%),
        radial-gradient(ellipse 50% 60% at 80% 70%, rgba(195,200,230,0.35) 0%, transparent 55%),
        #D4D8E0;
    }

    #cursor { position: fixed; width: 8px; height: 8px; background: var(--ink); border-radius: 50%; pointer-events: none; z-index: 9999; transform: translate(-50%,-50%); transition: width .25s ease, height .25s ease, opacity .25s ease; }
    #cursor.hover { width: 36px; height: 36px; opacity: .12; }

    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 200; display: flex; align-items: center; justify-content: space-between; padding: 28px 48px; border-bottom: 1px solid transparent; transition: all .4s ease; }
    nav.scrolled { padding: 18px 48px; background: rgba(212,216,224,0.7); backdrop-filter: blur(24px) saturate(1.5); -webkit-backdrop-filter: blur(24px) saturate(1.5); border-bottom: 1px solid rgba(255,255,255,0.55); box-shadow: 0 1px 0 rgba(0,0,0,0.04); }
    .nav-links { display: flex; gap: 32px; list-style: none; }
    .nav-links a { font-size: 13px; font-weight: 400; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); text-decoration: none; transition: color .2s; }
    .nav-links a:hover { color: var(--ink); }
    nav > a { display: flex; align-items: center; justify-content: center; transition: transform .3s ease; }
    nav > a:hover { transform: scale(1.12); }

    /* HERO */
    .hero { position: relative; z-index: 1; display: flex; flex-direction: column; padding: 0 48px; overflow: hidden; }
    .hero-inner { display: flex; flex-direction: column; padding-top: clamp(120px, 15vh, 150px); }
    .project-hero-card { background: rgba(255,255,255,0.2); backdrop-filter: blur(4px) saturate(1.1); -webkit-backdrop-filter: blur(4px) saturate(1.1); border: 1px solid rgba(255,255,255,0.22); box-shadow: 0 4px 32px rgba(0,0,0,0.04), inset 0 1px 0 rgba(255,255,255,0.35); border-radius: 24px; padding: 52px 80px 56px; margin-bottom: 20px; display: flex; flex-direction: column; gap: 24px; }
    .project-tag { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); opacity: 0; animation: fadeUp .6s ease .15s forwards; }
    .hero-title-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 32px; }
    .project-title { font-size: clamp(44px, 7vw, 100px); font-weight: 200; letter-spacing: -0.04em; line-height: 1.0; opacity: 0; animation: fadeUp .9s cubic-bezier(0.16,1,0.3,1) .25s forwards; }
    .project-title .blue { color: var(--blue); }
    .project-subtitle { font-size: clamp(16px, 1.8vw, 22px); font-weight: 300; color: var(--muted); letter-spacing: -0.01em; opacity: 0; animation: fadeUp .7s ease .5s forwards; }

    .back-link { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); text-decoration: none; transition: color .2s; opacity: 0; animation: fadeUp .6s ease .1s forwards; }
    .back-link svg { transition: transform .2s; }
    .back-link:hover { color: var(--ink); }
    .back-link:hover svg { transform: translateX(-3px); }

    .download-btn {
      flex-shrink: 0; display: inline-flex; align-items: center; gap: 10px;
      padding: 13px 24px; background: rgba(26,26,24,0.88); color: white;
      border-radius: 100px; font-size: 14px; font-weight: 400;
      letter-spacing: -0.01em; text-decoration: none;
      backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.12);
      transition: background .3s, gap .3s; cursor: none;
      opacity: 0; animation: fadeUp .7s ease .6s forwards;
    }
    .download-btn:hover { background: rgba(50,50,48,0.92); gap: 16px; }

    .hero-footer { display: flex; justify-content: space-between; align-items: center; padding: 22px 0; border-top: 1px solid rgba(0,0,0,0.08); opacity: 0; animation: fadeUp .7s ease .8s forwards; }
    .hero-footer-left { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }

    /* PDF VIEWER */
    .pdf-wrap { position: relative; z-index: 1; padding: 48px 48px 0; opacity: 0; animation: fadeUp .9s ease .7s forwards; }
    .pdf-card {
      background: rgba(255,255,255,0.2); backdrop-filter: blur(4px) saturate(1.1); -webkit-backdrop-filter: blur(4px) saturate(1.1);
      border: 1px solid rgba(255,255,255,0.22); box-shadow: 0 4px 24px rgba(0,0,0,0.04), inset 0 1px 0 rgba(255,255,255,0.35);
      border-radius: 20px; overflow: hidden;
    }
    .pdf-card iframe {
      display: block; width: 100%; height: 80vh; min-height: 600px;
      border: none;
    }

    /* FOOTER */
    footer { position: relative; z-index: 1; margin-top: 80px; padding: 28px 48px; border-top: 1px solid rgba(255,255,255,0.55); background: rgba(255,255,255,0.2); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; }
    .footer-left { font-size: 14px; font-weight: 300; color: var(--muted); }
    .footer-links { display: flex; gap: 24px; list-style: none; }
    .footer-links a { font-size: 13px; color: var(--muted); text-decoration: none; letter-spacing: 0.04em; transition: color .2s; }
    .footer-links a:hover { color: var(--ink); }
    .footer-right { font-size: 12px; color: var(--muted); }

    @keyframes fadeUp  { to { opacity: 1; transform: translateY(0); } }
    @keyframes scanLine { 0% { transform: translateX(-100%); } 50% { transform: translateX(100%); } 100% { transform: translateX(100%); } }

    @media (max-width: 768px) {
      nav, nav.scrolled { padding: 18px 24px; }
      .hero { padding: 0 24px; }
      .project-hero-card { padding: 40px 28px 44px; }
      .hero-title-row { flex-direction: column; align-items: flex-start; }
      .pdf-wrap { padding: 32px 24px 0; }
      .pdf-card iframe { height: 60vh; }
      footer { padding: 28px 24px; }
    }
  </style>
</head>
<body>

  <div class="bg-mesh"></div>
  <div id="cursor"></div>

  <!-- NAV -->
  <nav id="navbar">
    <a href="index.html" aria-label="Jay Ho">
      <svg width="22" height="50" viewBox="0 0 35 80" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path fill-rule="evenodd" clip-rule="evenodd" d="M20.8651 0H13.9639V33.9625H6.9012V3.73333H0V69.0517H6.9012V40.0861H13.9639V46.17C13.9639 53.4923 12.7975 61.3008 10.4647 69.5952L7.54867 79.8011H14.6443L17.6575 69.5952C19.7959 62.208 20.8651 54.3669 20.8651 46.0728V40.0861H27.702V69.0517H34.6667V3.73333H27.702V33.9625H20.8651V0Z" fill="#1a1a18"/>
      </svg>
    </a>
    <ul class="nav-links">
      <li><a href="work.html">Work</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <!-- HERO -->
  <section class="hero">
    <div class="hero-inner">
      <div class="project-hero-card">
        <a href="about.html" class="back-link">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M13 8H3M3 8L8 3M3 8L8 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Back to about
        </a>
        <div class="hero-title-row">
          <h1 class="project-title">Résumé</h1>
          <a href="JAY HO RESUME 2025.docx.pdf" download class="download-btn">
            Download PDF
            <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M8 3v8M8 11l-3-3M8 11l3-3" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </a>
        </div>
        <p class="project-subtitle">Product Designer · Vancouver, BC · jayho5403@gmail.com</p>
      </div>
    </div>
    <div class="hero-footer">
      <span class="hero-footer-left">Jay Ho &nbsp;·&nbsp; Vancouver, BC</span>
      <span style="font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);">Updated 2025</span>
    </div>
  </section>

  <!-- PDF VIEWER -->
  <div class="pdf-wrap">
    <div class="pdf-card">
      <iframe src="JAY HO RESUME 2025.docx.pdf" title="Jay Ho Resume"></iframe>
    </div>
  </div>

  <!-- FOOTER -->
  <footer>
    <div class="footer-left">Jay Ho — 2025</div>
    <ul class="footer-links">
      <li><a href="mailto:jayho5403@gmail.com">Email</a></li>
      <li><a href="https://www.linkedin.com/in/jay-ho-520134220/" target="_blank">LinkedIn</a></li>
      <li><a href="JAY HO RESUME 2025.docx.pdf" download>Download PDF</a></li>
    </ul>
    <div class="footer-right">Designed with intention.</div>
  </footer>

  <script>
    const cursor = document.getElementById('cursor');
    document.addEventListener('mousemove', e => { cursor.style.left = e.clientX + 'px'; cursor.style.top = e.clientY + 'px'; });
    document.querySelectorAll('a').forEach(el => { el.addEventListener('mouseenter', () => cursor.classList.add('hover')); el.addEventListener('mouseleave', () => cursor.classList.remove('hover')); });

    const navbar = document.getElementById('navbar');
    window.addEventListener('scroll', () => { navbar.classList.toggle('scrolled', window.scrollY > 40); });
  </script>
</body>
</html>
